<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }

    a{
      color: red;
      text-decoration: none;
      font-weight: bold;  
    }

    a:visited{
        color: darkred;
    }

    a:hover{
        color: black;
        text-decoration: underline;
    }

    a:active{
        color: yellow;
    }

    a::after{
        content: ' [link]';
        color: lightgray;
        font-weight: normal;
        text-decoration: nome;
    }
</style>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/LucasLima-15" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/pedro-lucas-araujo-lima-178781252/" target="_blank">Linkedin</a></li>
    </ul>
</body>
</html>
